      - identificador
      - nombre_comercial
      - codigo_moneda
      - multiplo_redondeo
      - revision
    Sesion:
      type: object
      additionalProperties: false
      properties:
        token_acceso:
          type: string
        token_actualizacion:
          type: string
          description: Omitible si se transporta en cookie HttpOnly.
        expira_en_segundos:
          type: integer
          const: 900
        usuario:
          $ref: '#/components/schemas/Usuario'
        organizacion:
          $ref: '#/components/schemas/Organizacion'
        onboarding_completado:
          type: boolean
      required:
      - token_acceso
      - expira_en_segundos
      - usuario
      - organizacion
      - onboarding_completado
    RegistroEntrada:
      type: object
      additionalProperties: false
      properties:
        nombre_completo:
          type: string
          minLength: 1
        correo:
          type: string
          format: email
        contrasena:
          type: string
          minLength: 10
          writeOnly: true
        nombre_consultorio:
          oneOf:
          - type: string
