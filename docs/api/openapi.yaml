      operationId: obtenerSalud
      summary: Consultar salud del proceso
      tags:
      - Salud
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstadoServicio'
              example:
                estado: ok
                version: abc123
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error500'
              example:
                detalle:
                  codigo: ERROR_INTERNO
      security: []
