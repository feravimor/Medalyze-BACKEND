      additionalProperties: false
      properties:
        correo:
          type: string
          format: email
        contrasena:
          type: string
          writeOnly: true
      required:
      - correo
      - contrasena
    RenovacionEntrada:
      type: object
      additionalProperties: false
      properties:
        token_actualizacion:
          type: string
          writeOnly: true
      description: Vacío cuando el refresh token viaja en cookie HttpOnly.
    Perfil:
      type: object
      additionalProperties: false
      properties:
        identificador:
          type: string
          format: uuid
        nombre_para_mostrar:
          type: string
        especialidades:
          type: array
          items:
            type: string
            format: uuid
        revision:
          type: integer
          minimum: 0
      required:
      - identificador
      - nombre_para_mostrar
      - especialidades
      - revision
    PerfilActualizar:
      type: object
      additionalProperties: false
      properties:
        nombre_para_mostrar:
