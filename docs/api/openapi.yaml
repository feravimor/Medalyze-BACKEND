openapi: 3.1.0
info:
  title: Medalyze API
  version: 1.0.0
  description: Contrato candidato de ARQ-03. La implementación de endpoints pertenece a BE-03 a BE-10.
servers:
- url: /api/v1
  description: Base relativa
tags:
- name: Salud
- name: Autenticación
- name: Cuenta
- name: Onboarding
- name: Capacidad
