components:
  securitySchemes:
    BearerJWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT de acceso con vigencia de 15 minutos.
  parameters:
    IdentificadorRuta:
      name: identificador
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Limite:
      name: limite
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
    Busqueda:
      name: busqueda
      in: query
      required: false
      schema:
        type: string
    Archivados:
      name: archivados
      in: query
      required: false
      schema:
        type: boolean
        default: false
    Estado:
      name: estado
      in: query
      required: false
      schema:
        type: string
    Especialidad:
      name: especialidad
      in: query
      required: false
      schema:
        type: string
    MisAreas:
      name: mis_areas
      in: query
      required: false
      schema:
        type: boolean
        default: false
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        pattern: ^\"?[0-9]+\"?$
      description: Revisión esperada del recurso.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
      description: Clave única por intento lógico.
  schemas:
    CampoError:
      type: object
      additionalProperties: false
      properties:
        campo:
          type: string
        mensaje:
          type: string
      required:
      - campo
      - mensaje
    BloqueoCalculo:
      type: object
      additionalProperties: false
      properties:
        codigo:
          type: string
          enum:
          - GASTO_NEGATIVO
          - EQUIPO_INCOMPLETO
          - SIN_COSTOS_INDIRECTOS_REGISTRADOS
          - SIN_PERFIL_CAPACIDAD
          - SIN_TIEMPO_ATENCION
          - DURACION_INVALIDA
          - ESPACIADO_FUERA_RANGO
          - SIN_METODO_MATERIALES
          - SIN_MESES_VALIDOS
          - INSUMO_ESPECIFICO_INVALIDO
          - RECETA_INCOMPLETA
          - IMPORTE_MATERIALES_FALTANTE
          - MATERIALES_EN_CERO
          - AJUSTE_FUERA_RANGO
        paso:
          type: integer
          minimum: 1
          maximum: 7
        mensaje:
          type: string
        identificador_recurso:
          oneOf:
          - type: string
            format: uuid
          - type: 'null'
        campo:
          oneOf:
          - type: string
          - type: 'null'
      required:
      - codigo
      - paso
      - mensaje
    DetalleError:
      type: object
      additionalProperties: false
      properties:
        codigo:
          type: string
        mensaje:
          type: string
        campos:
          type: array
          items:
            $ref: '#/components/schemas/CampoError'
          default: []
        bloqueos:
          type: array
          items:
            $ref: '#/components/schemas/BloqueoCalculo'
          default: []
        revision_actual:
          oneOf:
          - type: integer
            minimum: 0
          - type: 'null'
        request_id:
          oneOf:
          - type: string
          - type: 'null'
      required:
      - codigo
      - mensaje
    Error:
      type: object
      additionalProperties: false
      properties:
        detalle:
          $ref: '#/components/schemas/DetalleError'
      required:
      - detalle
    Error401:
      type: object
      additionalProperties: false
      properties:
        detalle:
          allOf:
          - $ref: '#/components/schemas/DetalleError'
          properties:
            codigo:
              type: string
              enum:
              - CREDENCIALES_INVALIDAS
              - SIN_AUTENTICACION
              - TOKEN_VENCIDO
      required:
      - detalle
    Error403:
      type: object
      additionalProperties: false
      properties:
        detalle:
          allOf:
          - $ref: '#/components/schemas/DetalleError'
          properties:
            codigo:
              type: string
              enum:
              - SIN_PERMISO
      required:
      - detalle
    Error404:
      type: object
      additionalProperties: false
      properties:
        detalle:
          allOf:
          - $ref: '#/components/schemas/DetalleError'
          properties:
            codigo:
              type: string
              enum:
              - NO_ENCONTRADO
      required:
      - detalle
    Error409:
      type: object
      additionalProperties: false
      properties:
        detalle:
          allOf:
          - $ref: '#/components/schemas/DetalleError'
          properties:
            codigo:
              type: string
              enum:
              - CORREO_YA_REGISTRADO
              - INSUMO_EN_USO
              - INSUMO_DUPLICADO
              - PERIODO_YA_REGISTRADO
              - CONFLICTO_REVISION
      required:
      - detalle
    Error422:
      type: object
      additionalProperties: false
      properties:
        detalle:
          allOf:
          - $ref: '#/components/schemas/DetalleError'
          properties:
            codigo:
              type: string
              enum:
              - ERROR_VALIDACION
              - CALCULO_BLOQUEADO
      required:
      - detalle
    Error428:
      type: object
      additionalProperties: false
      properties:
        detalle:
          allOf:
          - $ref: '#/components/schemas/DetalleError'
          properties:
            codigo:
              type: string
              enum:
              - REVISION_REQUERIDA
      required:
      - detalle
    Error500:
      type: object
      additionalProperties: false
      properties:
        detalle:
          allOf:
          - $ref: '#/components/schemas/DetalleError'
          properties:
            codigo:
              type: string
              enum:
              - ERROR_INTERNO
      required:
      - detalle
    EstadoServicio:
      type: object
      additionalProperties: false
      properties:
        estado:
          type: string
          enum:
          - ok
          - no_disponible
        version:
          type: string
      required:
      - estado
      - version
    Usuario:
      type: object
      additionalProperties: false
      properties:
        identificador:
          type: string
          format: uuid
        nombre_completo:
          type: string
        correo:
          type: string
          format: email
        rol:
          type: string
          enum:
          - PROPIETARIO
          - COLABORADOR
      required:
      - identificador
      - nombre_completo
      - correo
      - rol
    Organizacion:
      type: object
      additionalProperties: false
      properties:
        identificador:
          type: string
          format: uuid
        nombre_comercial:
          type: string
        codigo_moneda:
          type: string
          pattern: ^[A-Z]{3}$
          default: MXN
        multiplo_redondeo:
          type: string
          pattern: ^-?\d+(\.\d{1,10})?$
          examples:
          - '70.83'
        espaciado_por_defecto:
          oneOf:
          - type: integer
            minimum: 0
            maximum: 15
          - type: 'null'
        revision:
          type: integer
          minimum: 0
