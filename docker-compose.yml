services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: medalyze
      POSTGRES_USER: medalyze
      POSTGRES_PASSWORD: medalyze
    ports:
      - "5432:5432"
    volumes:
      - medalyze_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medalyze -d medalyze"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://medalyze_app:medalyze_app@postgres:5432/medalyze
      ALEMBIC_DATABASE_URL: postgresql+psycopg://medalyze:medalyze@postgres:5432/medalyze
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  medalyze_postgres:
