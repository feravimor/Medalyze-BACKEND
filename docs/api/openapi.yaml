          - type: integer
            minimum: 0
            maximum: 15
          - type: 'null'
    Especialidad:
      type: object
      additionalProperties: false
      properties:
        identificador:
          type: string
          format: uuid
        clave:
          type: string
        nombre:
          type: string
      required:
      - identificador
      - clave
      - nombre
    ListaEspecialidades:
      type: object
      additionalProperties: false
      properties:
        elementos:
          type: array
          items:
