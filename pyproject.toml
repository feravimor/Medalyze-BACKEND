[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "medalyze-backend"
version = "0.1.0"
description = "API v1 de Medalyze"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy==2.0.43",
  "psycopg[binary]==3.2.9",
  "alembic==1.16.5",
  "pydantic-settings>=2.7,<3",
  "pyjwt==2.14.0",
  "argon2-cffi>=23.1,<26",
  "python-multipart>=0.0.12,<1",
  "email-validator>=2.2,<3",
]

[project.optional-dependencies]
dev = [
  "jsonschema>=4.20,<5",
  "httpx>=0.27,<1",
  "hypothesis>=6,<7",
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "pyyaml>=6,<7",
  "types-PyYAML>=6,<7",
  "ruff>=0.7,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = [
  "B008", # FastAPI declara Depends/Query/Cookie en los parámetros de ruta.
  "E501", # El formateador gobierna el ancho; no se fragmentan mensajes ni SQL.
]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["postgres: requiere PostgreSQL 16 con las migraciones aplicadas"]
